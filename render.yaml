services:
  - type: web
    name: ndr-spices
    env: php
    plan: free
    buildCommand: "composer install --optimize-autoloader --no-dev && npm install && npm run build"
    startCommand: "php artisan config:cache && php artisan route:cache && apachectl -D FOREGROUND"
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: true
      - key: LOG_CHANNEL
        value: errorlog